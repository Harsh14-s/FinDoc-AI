[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "findoc"
version = "1.0.0"
description = "FinDocAI: Intelligent Financial Document Extraction, Validation and Risk Insights"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "streamlit>=1.32.0",
    "pandas>=2.2.0",
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "pytesseract>=0.3.10",
    "scikit-learn>=1.4.0",
    "reportlab>=4.1.0",
    "faker>=24.0.0",
    "python-multipart>=0.0.9",
    "pillow>=10.2.0",
    "pytest>=8.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
